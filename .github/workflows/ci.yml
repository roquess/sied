name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build NIF
        shell: bash
        run: |
          cargo build --release --manifest-path native/sied/Cargo.toml
          mkdir -p priv
          # Per-platform name sied-<os>-<arch>: Erlang loads NIFs as .so on all
          # Unix (macOS included) and .dll on Windows.
          case "$RUNNER_OS" in
            Windows) SRC=native/sied/target/release/sied.dll;      OS=windows; EXT=dll ;;
            macOS)   SRC=native/sied/target/release/libsied.dylib; OS=darwin;  EXT=so ;;
            *)       SRC=native/sied/target/release/libsied.so;     OS=linux;   EXT=so ;;
          esac
          case "$(uname -m)" in arm64|aarch64) ARCH=aarch64 ;; *) ARCH=x86_64 ;; esac
          cp "$SRC" "priv/sied-${OS}-${ARCH}.${EXT}"

      - name: Test
        run: rebar3 eunit

      - name: Upload prebuilt NIF
        uses: actions/upload-artifact@v4
        with:
          name: sied-nif-${{ runner.os }}
          path: priv/sied-*
          if-no-files-found: error

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD^ to diff the version

      - id: ver
        name: Detect version bump
        run: |
          cur=$(grep -oP '\{vsn,\s*"\K[0-9.]+' src/sied.app.src | head -1)
          prev=$(git show HEAD^:src/sied.app.src 2>/dev/null | grep -oP '\{vsn,\s*"\K[0-9.]+' | head -1 || true)
          echo "version=$cur" >> "$GITHUB_OUTPUT"
          if [ -z "$cur" ] || [ "$cur" = "$prev" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no version change ('$cur'); skipping publish"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/sied/releases/$cur")
          if [ "$code" = "200" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::warning::sied $cur already published on hex; skipping"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sied version bump detected: '$prev' -> '$cur'"
          fi

      - uses: erlef/setup-beam@v1
        if: steps.ver.outputs.bumped == 'true'
        with:
          otp-version: '27'   # rebar3_hex is happiest on <=27
          rebar3-version: '3'

      # sied's own rebar.config ships no rebar3_hex plugin; enable it globally
      # (runner-only, never in the package). Harmless for em_filter too.
      - name: Enable rebar3_hex (global, not shipped)
        if: steps.ver.outputs.bumped == 'true'
        run: |
          mkdir -p ~/.config/rebar3
          echo '{plugins, [{rebar3_hex, "7.0.6"}]}.' > ~/.config/rebar3/rebar.config

      # rebar3_hex 7.0.6 does NOT read HEX_API_KEY on the publish/write path
      # (only merge_with_env, which publish bypasses). Write the api_key straight
      # into the hex auth config so hex_config_write uses it directly (no local
      # password). The key MUST have api write permission.
      - name: Configure hex auth
        if: steps.ver.outputs.bumped == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          printf '#{<<"hexpm">> => #{api_key => <<"%s">>}}.\n' "$HEX_API_KEY" > ~/.config/rebar3/hex.config

      - name: Publish dry-run
        if: steps.ver.outputs.bumped == 'true'
        run: rebar3 hex publish package --dry-run

      - name: Publish to hex
        if: steps.ver.outputs.bumped == 'true'
        run: rebar3 hex publish package --yes

      - name: Tag release
        if: steps.ver.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
