name: Build NIF binaries

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

# Build the per-platform prebuilt NIFs (sied-<os>-<arch>) and commit them so the
# hex package works without a Rust toolchain. Jobs run sequentially: each commits
# its binary and rebases on the previous one before pushing.
jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build & commit
        run: |
          cargo build --release --manifest-path native/sied/Cargo.toml
          mkdir -p priv
          cp native/sied/target/release/libsied.so priv/sied-linux-x86_64.so
          bash .github/commit-nif.sh priv/sied-linux-x86_64.so "Linux x86_64"

  darwin:
    needs: linux-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build & commit (aarch64 + x86_64)
        run: |
          mkdir -p priv
          cargo build --release --manifest-path native/sied/Cargo.toml
          cp native/sied/target/release/libsied.dylib priv/sied-darwin-aarch64.so
          cargo build --release --target x86_64-apple-darwin --manifest-path native/sied/Cargo.toml
          cp native/sied/target/x86_64-apple-darwin/release/libsied.dylib priv/sied-darwin-x86_64.so
          bash .github/commit-nif.sh priv/sied-darwin-aarch64.so "macOS aarch64"
          bash .github/commit-nif.sh priv/sied-darwin-x86_64.so "macOS x86_64"

  windows-x86_64:
    needs: darwin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build & commit
        shell: bash
        run: |
          cargo build --release --manifest-path native/sied/Cargo.toml
          mkdir -p priv
          cp native/sied/target/release/sied.dll priv/sied-windows-x86_64.dll
          bash .github/commit-nif.sh priv/sied-windows-x86_64.dll "Windows x86_64"

  linux-aarch64:
    needs: windows-x86_64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build & commit
        run: |
          cargo build --release --manifest-path native/sied/Cargo.toml
          mkdir -p priv
          cp native/sied/target/release/libsied.so priv/sied-linux-aarch64.so
          bash .github/commit-nif.sh priv/sied-linux-aarch64.so "Linux aarch64"
